[package]
name = "carnet-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Carnet's notes in the browser: the PWA's Rust (docs/SYNC.md §8)"

# The PWA's sync, notes and Markdown, as wasm for web/ (wasm-bindgen): the
# same session, CRDTs, keys and renderer as the desktop, behind a small
# sans-I/O API. The socket, IndexedDB and the service worker are web/'s.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
carnet-core = { path = "../carnet-core" }
carnet-sync = { path = "../carnet-sync" }
# Pinned to the CLI that binds it (`wasm-bindgen --version`).
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
# The pairing code as a QR code, for a phone's camera.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# tests/viewer.rs: a desktop's session and this one, through the hub.
carnet-server = { path = "../carnet-server" }
