[package]
name = "carnet-server"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Carnet's sync server: it orders, stores and relays sealed records, and never reads one"

# The hub (logins, rooms, the vault feed) has no I/O in it, like the
# device's session: the network and the disk are drivers around it, and
# the simulation in tests/ drives it with neither (docs/SYNC.md §6).
[dependencies]
carnet-sync = { path = "../carnet-sync" }
loro-protocol = "=0.3.0"
# The binary: one file of SQLite (WAL) for everything, axum for HTTP and
# the WebSocket, tokio under both.
rusqlite = { version = "0.40", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
# Signed links to files (links.rs): HMAC-SHA256, the versions the
# key derivation in carnet-sync already pulls in.
hmac = "0.13"
sha2 = "0.11"
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The PWA (web/), served at `/` from its build: its Brotli and gzip copies
# as they are when the browser takes them.
tower-http = { version = "0.6", features = ["fs", "timeout"] }
# TLS on its own listener, if asked (tls.rs): rustls with ring, as the
# rest of Carnet's TLS (no OpenSSL).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Served with hyper as axum serves, and a request's head read in a time
# (`server::serve_app`): a client that sends one slowly is let go.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# A file served by its link as one on disk is (ranges and all): ServeFile,
# called as a service.
tower = { version = "0.5", default-features = false, features = ["util"] }
# A database server for the records (postgres.rs), off by default: the
# synchronous client, as the hub is one thread that waits on its store.
postgres = { version = "0.19", optional = true }
# TLS to it, for a database elsewhere: rustls with ring and the web's
# roots, as carnet-sync's client has them (no OpenSSL).
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
# Files in an S3-compatible bucket (s3.rs), off by default: links
# signed here (rusty-s3, no I/O of its own), the few calls the server
# makes itself over ureq, MD5 for what S3 checks a put by.
rusty-s3 = { version = "0.10", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
md-5 = { version = "0.11", optional = true }
url = { version = "2", optional = true }

# A server of one's own needs neither: SQLite and files on disk. A hosted
# one past their size turns them on, and moves over with `migrate`.
[features]
postgres = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]
s3 = ["dep:rusty-s3", "dep:ureq", "dep:md-5", "dep:url"]

[dev-dependencies]
# sqlite.rs: what SQLite steps through for a write, counted (its progress
# handler), so a write's cost is checked by more than a clock.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
tokio-tungstenite = "0.30"
# tests/link.rs: the desktop's own socket against this binary.
carnet-sync = { path = "../carnet-sync", features = ["net"] }
# s3.rs: a put link signed at a moment of the test's own (rusty-s3's clock).
jiff = { version = "0.2", default-features = false, features = ["std"] }
# tests/tls.rs: certificates and CAs of the test's own making.
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }

