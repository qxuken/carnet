[package]
name = "carnet"
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"

# The app, and beside it what other builds share with it: `carnet-core`,
# the Markdown model with no kui in it; `carnet-sync`, the notes as CRDTs
# and a device's side of sync; and `carnet-server` (docs/SYNC.md §10).
# Plain `cargo build` and `cargo test` cover them all.
[workspace]
members = [".", "crates/carnet-core", "crates/carnet-sync", "crates/carnet-server", "crates/carnet-web"]
default-members = [".", "crates/carnet-core", "crates/carnet-sync", "crates/carnet-server", "crates/carnet-web"]
# The fuzz targets, with their own workspace.
exclude = ["fuzz"]

[dependencies]
carnet-core = { path = "crates/carnet-core" }
carnet-sync = { path = "crates/carnet-sync", features = ["net"] }
# Sync's keys in the system's keychain: macOS's, Windows' Credential
# Manager, the Secret Service on Linux (over zbus, as kui already is).
keyring = "4"
# kui as released on crates.io, pinned: a release of Carnet names the kui
# it was built with. To try kui's main, point this at a checkout with
# `path = "../kui/crates/kui-native"`.
kui-native = "=0.1.0-alpha.73"
# Pictures in notes: what a paste brings beyond text (kui puts a picture on
# the clipboard but reads only text back) and the files'. Both are already
# in kui-native's tree; these name them for Carnet's use.
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The notes folder watched for other apps' changes: the system's file
# events (FSEvents, inotify, ReadDirectoryChangesW), so an idle folder
# costs nothing (src/watch.rs).
notify = "8.2"
# A divider's picture, and a note's, may be an SVG: drawn into pixels as
# it's picked or shown. kui's own version (it draws SVGs too), so one
# resvg, tiny-skia and fontdb are built, not two of each; text in it in
# the system's fonts; a gzipped one read as it is (0.46 always does). No
# pictures inside it, which would bring a JPEG decoder of its own.
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Local time: a pasted picture's file is named for when it was pasted, as
# the clock on the wall says it.
jiff = "0.2"
# The pairing code as a QR code, for a phone's camera (Settings → Sync).
qrcode = { version = "0.14", default-features = false }
# GitHub's answer on the latest release (src/update.rs): already in the
# tree, through carnet-sync.
serde_json = "1"

# The picture decoders and the font shaper are slow unoptimised: a debug
# build optimises its dependencies, so a dropped photo shows as quickly
# as in a release build.
[profile.dev.package."*"]
opt-level = 2

# The store's property test: random edits, saves, other apps' edits,
# renames and restarts (src/store.rs).
[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }
# src/sync_tests.rs: two notes folders syncing through the hub, in memory;
# app_tests: two whole apps through the server binary's own code.
carnet-server = { path = "crates/carnet-server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
# A hosted service's signup route, faked beside a real server.
axum = "0.8"
# src/sync_tests.rs: a vault written as a hostile or older device would,
# past what carnet-sync writes. The version carnet-sync pins.
loro = "=1.16.2"

# The Windows executable's icon and version (packaging/windows/carnet.rc).
[build-dependencies]
embed-resource = "3.0"

# The PWA's wasm (crates/carnet-web, web/): small over fast
# (docs/SYNC.md §8). `cargo build -p carnet-web --profile web
# --target wasm32-unknown-unknown`.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
