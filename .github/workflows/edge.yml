# GitHub Actions: every push to main, carnet-server's image as main
# stands, for whoever runs the newest server, built from
# packaging/server/Dockerfile as image.yml builds a release's:
#
#   ghcr.io/<owner>/carnet-server:main     the newest
#   ghcr.io/<owner>/carnet-server:<sha>    each commit's
#
# For amd64 only, and on ghcr.io only: released images (image.yml) are
# the ones for both platforms and Docker Hub. Its build cache is the
# amd64 release build's (the same scope), so a release starts from main's
# layers. A newer push stops an older build; the newest is the one that
# matters. Pushing takes the job's own token, with `packages: write`.
name: edge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: edge
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/carnet-server

jobs:
  server-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/server/Dockerfile
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          tags: |
            ${{ env.GHCR_IMAGE }}:main
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max
