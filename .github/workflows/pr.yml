# GitHub Actions: pull requests opened on GitHub. Forgejo is where Carnet
# lives and where every push is checked (.forgejo/workflows/ci.yml, which
# also runs the server against a real Postgres and bucket); this is the
# same checking for a contribution that arrives here, before it is
# merged on the forge and the mirror brings it back. No secrets: a pull
# request from a fork gets none.
#
#   test     the workspace's tests and clippy
#   wasm     carnet-core and carnet-sync built for the browser
#   web      the viewer: crates/carnet-web as wasm, its types, the page
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # kui's sound links ALSA.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: rustup toolchain install stable --profile minimal -c clippy -t wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: carnet-core and carnet-sync for the browser
        run: cargo build --locked -p carnet-core -p carnet-sync --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The CLI's version is the one carnet-web pins.
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.129
      - name: The viewer
        working-directory: web
        run: |
          set -eux
          npm ci
          npm run wasm
          npm run check
          npm test
          npx vite build
