# Every push to main: carnet-server's image as main stands, for whoever
# runs the newest server. Released images are GitHub's (image.yml), on
# Docker Hub and ghcr.io; this one stays on the forge:
#
#   drydock9.qxuken.dev/qxuken/carnet-server:main     the newest
#   drydock9.qxuken.dev/qxuken/carnet-server:<sha>    each commit's
#
# This instance's runners have no Docker daemon in a job, so the image is
# not built from packaging/server/Dockerfile but put together by
# packaging/server/image.sh with crane, from the server and the viewer
# built here first: the same files, users and settings, on the same
# Debian (node:24-bookworm builds against bookworm's glibc).
#
# Pushing takes a token that may write this owner's packages:
# secrets.PACKAGES_TOKEN when set (a token with write:package), else the
# job's own.
name: edge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: edge
  cancel-in-progress: true

env:
  CRANE_VERSION: "0.22.1"
  CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"

jobs:
  server-image:
    runs-on: docker
    container:
      image: node:24-bookworm
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Build environment
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends brotli
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal \
              --default-toolchain stable -t wasm32-unknown-unknown
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/crane.tgz \
              "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tgz" | sha256sum -c -
          tar -xzf /tmp/crane.tgz -C /usr/local/bin crane

      - name: Restore the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: The server
        run: cargo build --release --locked -p carnet-server

      - name: The viewer
        working-directory: web
        run: |
          set -eux
          cargo install --locked wasm-bindgen-cli --version 0.2.129
          npm ci
          npm run wasm
          npx vite build
          sh scripts/compress.sh

      - name: The image
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          host=${GITHUB_SERVER_URL#https://}
          image="$host/${GITHUB_REPOSITORY_OWNER}/carnet-server"
          echo "$TOKEN" | crane auth login "$host" -u "$GITHUB_ACTOR" --password-stdin
          sh packaging/server/image.sh --binary target/release/carnet-server --web web/dist --health \
              --env CARNET_DATA=/data --env CARNET_LISTEN=0.0.0.0:8080 --env CARNET_WEB=/usr/share/carnet/web \
              "$image:$GITHUB_SHA" "$image:main"
